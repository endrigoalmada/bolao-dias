name: Atualizar placar (resultados ao vivo)

# BACKUP do historico. O tempo real vem da PROPRIA PAGINA, que busca a ESPN ao
# vivo no navegador. Este robo so arquiva os resultados em resultados.json algumas
# vezes por dia (cold-start e jogos antigos). So commita se algo mudou.
# Pode rodar na mao em "Run workflow" se quiser forcar.
on:
  schedule:
    # Slots derivados dos horarios REAIS dos jogos (kickoff + ~2h30 ate +3h30):
    # roda so DEPOIS das partidas, ~30-90 min apos cada jogo, pra pescar os
    # melhores momentos da CazeTV. Nada nas horas mortas (08-17 UTC).
    - cron: "30 18-23,0-7 * * *"
    - cron: "0 2-4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: placar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Buscar resultados na ESPN
        run: node scripts/fetch-results.mjs
      - name: Buscar melhores momentos (CazéTV)
        run: node scripts/fetch-highlights.mjs
      - name: Commitar se houve mudanca
        run: |
          git config user.name "Placar Bot"
          git config user.email "actions@github.com"
          git add resultados.json highlights.json
          if git diff --staged --quiet; then
            echo "Sem mudancas."
          else
            git commit -m "placar: resultados atualizados automaticamente"
            git push
            echo "Resultados atualizados e publicados."
          fi
